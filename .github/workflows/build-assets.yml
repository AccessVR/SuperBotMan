name: Build Assets

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from composer.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' composer.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install system dev dependencies
        run: npm install @rollup/rollup-linux-x64-gnu

      - name: Build assets
        run: npm run build

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Every publish from upstream lands here as a push to main, but only
      # a version bump is a release. Re-tagging an existing version would
      # be rejected and turn this red on ordinary changes, so a version
      # that is already tagged is simply nothing to do.
      - name: Tag the release, if this version is new
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged — no release to cut."
            exit 0
          fi

          git add public/build -f
          git commit -m "Build assets for version $VERSION" || echo "No changes to commit"
          git tag -a "v$VERSION" -m "Version $VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 